<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        /* --- 基本デザイン・配色設定 --- */
        :root {
            --bg-color: #f8f9fa;     /* 明るくクリーンなグレー */
            --text-color: #212529;   /* メイン文字色 */
            --accent-color: #4f46e5; /* トレンド感のあるブルーインディゴ */
            --accent-hover: #4338ca;
            --card-bg: #ffffff;      
            --border-color: #e5e7eb; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- ヘッダー --- */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 30px 0;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 0.05em;
            color: var(--text-color);
        }

        header p {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 5px;
        }

        /* --- メインレイアウト --- */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 320px 1fr; /* 左：投稿フォーム、右：タイムライン */
            gap: 40px;
        }

        /* --- 投稿フォーム（左側） --- */
        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .form-section h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #4b5563;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #f9fafb;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- タイムライン・記事一覧（右側） --- */
        /* カテゴリフィルター */
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #4b5563;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* グリッド配置 */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        /* カードデザイン */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .post-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #e0e7ff 0%, #e0f2fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px;
            text-align: center;
        }

        .post-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .post-tag {
            font-size: 0.75rem;
            background-color: #eef2ff;
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .post-author {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .post-title {
            font-size: 1rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .post-desc {
            font-size: 0.85rem;
            color: #4b5563;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .post-footer {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* 削除ボタン */
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- レスポンシブ対応（スマホ表示） --- */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
            .form-section {
                position: static;
            }
        }
    </style>
</head>
